algorithm: PPO
policy: CnnPolicy
device: cuda
seed: 42

env:
  backend: stable-retro
  stable_retro_game: Contra-Nes
  stable_retro_state: Level1
  stable_retro_scenario:
  stable_retro_info:
  stable_retro_integration_path: integrations
  vec_env_start_method: forkserver
  action_set: SIMPLE_MOVEMENT
  frame_skip: 4
  grayscale: true
  screen_size: 84
  frame_stack: 4
  n_envs: 8
  max_episode_steps: 18000
  stuck_timeout_steps: 900

training:
  total_timesteps: 5000000
  n_steps: 128
  batch_size: 256
  n_epochs: 4
  learning_rate: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

logging:
  run_name: ppo_stable_retro
  metrics_log_freq: 1000
  checkpoint_freq: 100000
  eval_freq: 50000
